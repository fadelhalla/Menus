<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menus</title>
  <style>
    :root { --bg: #FAF8F4; --ink: #1C1712; --muted: #6E6355; --line: #E5DCCD; --card: #fff; color-scheme: only light; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 32px; }
    p { margin: 0; color: var(--muted); }
    a.card { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--ink); }
    .card b { font-size: 18px; display: block; }
    .soon { opacity: .55; pointer-events: none; }
    code { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Restaurant menus</h1>
    <p>Interactive menus with dine-in, pickup and delivery ordering.</p>
    <a class="card" href="burger/"><b>Brick &amp; Bun</b><span>Burgers · try <code>burger/?table=12</code> for the dine-in QR flow</span></a>
    <a class="card" href="italian/"><b>Mattarello</b><span>Fresh pasta bar · build-your-own bowl · try <code>italian/?table=7</code></span></a>
  </main>
</body>
</html>
